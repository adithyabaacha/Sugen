services:
  coder:
    build: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}

      ICD_RERANK_MODE: ${ICD_RERANK_MODE:-lexical}

      ICD_CE_MODEL_PATH: /app/models/cross_encoder
      ICD_CE_CANDIDATES: ${ICD_CE_CANDIDATES:-30}
      ICD_CE_BATCH_SIZE: ${ICD_CE_BATCH_SIZE:-8}
      ICD_CE_MAX_LENGTH: ${ICD_CE_MAX_LENGTH:-256}
      ICD_CE_WEIGHT: ${ICD_CE_WEIGHT:-0.75}
      ICD_CE_THREADS: ${ICD_CE_THREADS:-4}
      ICD_CE_TIME_BUDGET_SECONDS: ${ICD_CE_TIME_BUDGET_SECONDS:-2400}

      ICD_USE_LLM: ${ICD_USE_LLM:-auto}
      ICD_LLM_MODEL: ${ICD_LLM_MODEL:-gpt-4.1-mini}
      ICD_CANDIDATES: ${ICD_CANDIDATES:-50}
      ICD_MAX_LLM_CALLS: ${ICD_MAX_LLM_CALLS:-600}
      ICD_LLM_TIMEOUT: ${ICD_LLM_TIMEOUT:-20}
      ICD_LLM_BUDGET_USD: ${ICD_LLM_BUDGET_USD:-4.50}
      ICD_INPUT_PRICE_PER_M: ${ICD_INPUT_PRICE_PER_M:-0.40}
      ICD_OUTPUT_PRICE_PER_M: ${ICD_OUTPUT_PRICE_PER_M:-1.60}

      ICD_MMS_PATH: /app/data/mms-2026-01.json

    volumes:
      - ./in:/in:ro
      - ./out:/out
