services:
  coder:
    build: .

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}

      ICD_RERANK_MODE: ${ICD_RERANK_MODE:-llm}
      ICD_LLM_PROVIDER: ${ICD_LLM_PROVIDER:-openai}
      ICD_LLM_MODEL: ${ICD_LLM_MODEL:-gpt-4.1-mini}
      ICD_USE_LLM: ${ICD_USE_LLM:-auto}

      ICD_CANDIDATES: ${ICD_CANDIDATES:-100}
      ICD_MAX_LLM_CALLS: ${ICD_MAX_LLM_CALLS:-750}
      ICD_LLM_TIMEOUT: ${ICD_LLM_TIMEOUT:-30}
      ICD_LLM_MAX_TOKENS: ${ICD_LLM_MAX_TOKENS:-500}
      ICD_LLM_DELAY_SECONDS: ${ICD_LLM_DELAY_SECONDS:-0}
      ICD_LLM_BUDGET_USD: ${ICD_LLM_BUDGET_USD:-4.50}

      ICD_LLM_BACKOFF_SECONDS: ${ICD_LLM_BACKOFF_SECONDS:-0.75}
      ICD_LLM_TRANSIENT_RETRIES: ${ICD_LLM_TRANSIENT_RETRIES:-2}
      ICD_LLM_TIME_BUDGET_SECONDS: ${ICD_LLM_TIME_BUDGET_SECONDS:-3000}
      ICD_LLM_BREAKER_FAILURES: ${ICD_LLM_BREAKER_FAILURES:-3}

      ICD_INPUT_PRICE_PER_M: ${ICD_INPUT_PRICE_PER_M:-}
      ICD_OUTPUT_PRICE_PER_M: ${ICD_OUTPUT_PRICE_PER_M:-}

      ICD_NORMALIZE_MODE: ${ICD_NORMALIZE_MODE:-all}
      ICD_NORMALIZE_MAX_CALLS: ${ICD_NORMALIZE_MAX_CALLS:-600}
      ICD_NORMALIZE_BUDGET_USD: ${ICD_NORMALIZE_BUDGET_USD:-0.50}
      ICD_NORMALIZE_NEW_CANDIDATES: ${ICD_NORMALIZE_NEW_CANDIDATES:-20}

      ICD_MMS_PATH: /app/data/mms-2026-01.json

    volumes:
      - ./in:/in:ro
      - ./out:/out
